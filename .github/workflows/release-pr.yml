name: Build Unsigned Release v8a APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 禁用 Gradle 自动缓存，防止 GitHub 缓存服务临时宕机导致流程中断
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. assembleRelease: 编译 Release 版本
    # 2. -Pandroid.injected.build.abi=arm64-v8a: 限制只生成 v8a 架构
    - name: Build Unsigned Release arm64-v8a APK
      run: ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --stacktrace

    # 使用 **/*.apk 匹配路径，确保无论输出文件名叫 app-release.apk 还是 app-release-unsigned.apk 都能成功抓取
    - name: Upload v8a Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a-release-unsigned
        path: app/build/outputs/apk/**/*.apk