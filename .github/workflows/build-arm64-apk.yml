name: Build signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      abi:
        description: "Which native libraries to include (arm64-v8a is what almost all phones need)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ABI: ${{ inputs.abi || 'arm64-v8a' }}

jobs:
  build:
    # pinned on purpose, "ubuntu-latest" is about to move to a new Ubuntu version
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The Gradle project can be the repository root or a sub folder (e.g. Gallery-main), find it
      - name: Locate Gradle project
        id: locate
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found in the repository"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Gradle project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.dir }}/**/*.gradle*
            ${{ steps.locate.outputs.dir }}/gradle/wrapper/gradle-wrapper.properties
            ${{ steps.locate.outputs.dir }}/gradle/*.versions.toml

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ---------------------------------------------------------------------------------------------
      # Signing. The build script (app/build.gradle.kts) reads SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD from the environment.
      #
      # * All 4 repository secrets set -> your own permanent key is used, every build has the same
      #   signature, so a new APK installs over the old one.
      # * No secret set -> a temporary key is generated. The APK is signed and installs, but every build
      #   has a different signature, so it can NOT be installed over an older build (uninstall first).
      # * Only some of the secrets set -> the build stops with an error, so a typo does not silently
      #   produce an APK with a different signature.
      # ---------------------------------------------------------------------------------------------
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          SET_COUNT=0
          for v in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$v" ]; then
              SET_COUNT=$((SET_COUNT + 1))
            fi
          done

          if [ "$SET_COUNT" -eq 4 ]; then
            echo "Using the signing key from the repository secrets"
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "::error::The keystore can not be opened with the given secrets. Check KEYSTORE_BASE64 (must be the base64 of the .jks file on ONE line), KEYSTORE_PASSWORD and KEY_ALIAS."
              exit 1
            fi
          elif [ "$SET_COUNT" -eq 0 ]; then
            echo "::warning::No signing secrets found, generating a temporary key. A build signed with a temporary key can not be installed over a build signed with another key."
            STORE_PASS=$(openssl rand -hex 16)
            ALIAS="temporary"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Gallery CI, O=CI, C=US"
          else
            echo "::error::Only $SET_COUNT of the 4 signing secrets are set. Set all of KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD, or none of them."
            exit 1
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "SIGNING_STORE_FILE=$KEYSTORE_FILE"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      # assembleFossRelease: only the foss flavor (assembleRelease would also build gplay)
      # -PABI_FILTER: handled in app/build.gradle.kts, keeps only the native libraries of that ABI
      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ABI_ARG=""
          if [ "$ABI" != "all" ]; then
            ABI_ARG="-PABI_FILTER=$ABI"
          fi
          ./gradlew assembleFossRelease $ABI_ARG \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            --stacktrace

      - name: Find the APK
        id: apk
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "All APK files found by the build:"
          find . -name '*.apk' -not -path './.git/*' -print
          APK_DIR="app/build/outputs/apk/foss/release"
          if ! ls "$APK_DIR"/*.apk > /dev/null 2>&1; then
            echo "::error::No APK in $APK_DIR, see the list above"
            exit 1
          fi
          if ls "$APK_DIR"/*unsigned*.apk > /dev/null 2>&1; then
            echo "::error::The build produced an unsigned APK, the signing config was not applied"
            exit 1
          fi
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in ${{ steps.apk.outputs.apk_dir }}/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ env.ABI }}-release-${{ github.run_number }}
          path: ${{ steps.locate.outputs.dir }}/${{ steps.apk.outputs.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30

      # When something fails, the Gradle reports contain the real reason
      - name: Upload build reports (only when the build failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            ${{ steps.locate.outputs.dir }}/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
